<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zobi Teardown &amp; Our Gap Analysis — Choose Language</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --ink:#16181d; --muted:#5b6472;
    --accent:#2f6df0; --accent2:#0f9d76; --line:#e3e7ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:min(860px,94vw);text-align:center}
  h1{font-size:30px;letter-spacing:-.4px;line-height:1.3}
  p.sub{color:var(--muted);margin:14px 0 34px;font-size:16px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:16px;padding:32px 26px;text-align:center;
    box-shadow:0 10px 30px rgba(20,30,60,.06);
    transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
  a.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 16px 40px rgba(20,30,60,.12)}
  .card .lang{font-size:27px;font-weight:800;letter-spacing:-.3px}
  .card.en .lang{color:var(--accent)}
  .card.zh .lang{color:var(--accent2)}
  .card .desc{color:var(--muted);font-size:14.5px;line-height:1.6;margin-top:10px}
  .card .go{display:inline-block;margin-top:18px;font-size:13.5px;font-weight:700;color:#fff;
    background:var(--accent);border-radius:20px;padding:7px 20px}
  .card.zh .go{background:var(--accent2)}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Zobi Teardown &amp; Our Gap Analysis</h1>
    <p class="sub">Choose a language · 选择语言</p>
    <div class="cards">
      <a class="card en" href="zobi-teardown.html">
        <div class="lang">English</div>
        <div class="desc">Zobi Teardown &amp; How We Close the Gap<br>the version shared with our partner</div>
        <div class="go">Open English →</div>
      </a>
      <a class="card zh" href="zobi-teardown-zh.html">
        <div class="lang">中文</div>
        <div class="desc">Zobi 拆解 &amp; 我们的差距分析<br>自用 / 学习版</div>
        <div class="go">进入中文版 →</div>
      </a>
    </div>
  </div>
</body>
</html>
